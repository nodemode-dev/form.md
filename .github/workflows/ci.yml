name: ci

on:
  push:
    branches: [main, 'compile_v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install web dependencies
        run: npm ci --no-audit --no-fund
        working-directory: web
      - name: audit web dependencies
        run: npm audit --audit-level=low
        working-directory: web
      - name: format, vet and typecheck
        run: make check
      - name: build
        run: make build VERSION=v0.0.0-ci
      - name: cross-compile
        run: |
          for t in linux/arm64 darwin/arm64 windows/amd64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/form-md
          done
      - name: smoke
        run: |
          FORMMD_DATA="$RUNNER_TEMP/data" ./bin/form-md &
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:8750/healthz && break; sleep 0.2; done
          FORMMD_DATA="$RUNNER_TEMP/data" ./bin/form-md backup "$RUNNER_TEMP/backup.tgz"
          FORMMD_DATA="$RUNNER_TEMP/data" ./bin/form-md doctor || true
          kill %1
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go tests
        run: go test -count=1 ./...
  window:
    runs-on: ubuntu-latest
    steps:
      - name: Apt mirror fallback
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            grep -q mirrors.edge.kernel.org /etc/apt/apt-mirrors.txt || printf 'http://mirrors.edge.kernel.org/ubuntu/\tpriority:1\n' | sudo tee -a /etc/apt/apt-mirrors.txt >/dev/null
            grep -q '//archive.ubuntu.com' /etc/apt/apt-mirrors.txt || printf 'http://archive.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee -a /etc/apt/apt-mirrors.txt >/dev/null
          fi
          printf 'Acquire::Retries "3";\n' | sudo tee /etc/apt/apt.conf.d/80-ci-retries >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build the window
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: build the server
        run: CGO_ENABLED=0 go build -o bin/form-md ./cmd/form-md
      - name: pytest and Playwright
        run: |
          pip install pytest==9.1.1 playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: window smoke (F7)
        run: python -m pytest web/tests/window -q -p no:cacheprovider
