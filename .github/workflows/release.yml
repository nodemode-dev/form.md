name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: check the tag matches the Makefile
        run: test "$(sed -n 's/^VERSION := //p' Makefile)" = "$GITHUB_REF_NAME"
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: make check
      - run: make release
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp install.sh deploy/form-md.service release/
          gh release create "$GITHUB_REF_NAME" release/* --title "form.md $GITHUB_REF_NAME" --generate-notes

  image:
    runs-on: ubuntu-24.04
    needs: binaries
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          push: true
          tags: |
            ghcr.io/nodemode-ai/form.md:${{ github.ref_name }}
            ghcr.io/nodemode-ai/form.md:latest
