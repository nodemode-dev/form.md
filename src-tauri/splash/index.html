<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>form.md</title>
<style>
:root { color-scheme: dark; }
html, body { margin: 0; height: 100%; background: #111113; color: #f7f7f7; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
body { display: grid; place-items: center; border: 1px solid #2a2a2e; box-sizing: border-box; border-radius: 12px; overflow: hidden; }
.mark { display: grid; justify-items: center; gap: 14px; }
.mark img { display: block; width: 64px; height: 64px; }
.label { color: #a4a4a8; }
.bar { width: 120px; height: 2px; border-radius: 2px; background: #2a2a2e; overflow: hidden; }
.bar i { display: block; width: 40%; height: 100%; background: #9a8cff; animation: run 1.1s ease-in-out infinite; }
@keyframes run { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
@media (prefers-reduced-motion: reduce) { .bar i { animation: none; width: 100%; opacity: .5; } }
</style>
</head>
<body>
<div class="mark" role="status">
<img src="icon.png" width="64" height="64" alt="">
<div class="label">Starting form.md</div>
<div class="bar"><i></i></div>
</div>
</body>
</html>
