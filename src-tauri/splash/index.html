<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>form.md</title>
<style>
:root { color-scheme: dark; }
html { height: 100%; background: transparent; }
body { margin: 0; height: 100%; box-sizing: border-box; background: #0a0a0a; border: 1px solid rgba(255, 255, 255, 0.09); border-radius: 16px; overflow: hidden; color: #a8a8b8; font: 13px -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: calc(50vh - 64px); gap: 18px; -webkit-user-select: none; user-select: none; }
.mark { display: contents; }
.mark img { display: block; width: 72px; height: 72px; }
.label { margin: 0; height: 16px; line-height: 16px; letter-spacing: 0.2px; }
.bar { width: 180px; height: 3px; border-radius: 2px; background: #1f1f26; overflow: hidden; }
.bar i { display: block; width: 40%; height: 100%; background: #9a8cff; animation: run 1.1s ease-in-out infinite; }
@keyframes run { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
@media (prefers-reduced-motion: reduce) { .bar i { animation: none; width: 100%; opacity: .5; } }
</style>
</head>
<body>
<div class="mark" role="status">
<img src="icon.png" width="72" height="72" alt="">
<div class="label">Starting form.md</div>
<div class="bar"><i></i></div>
</div>
</body>
</html>
